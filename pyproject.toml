[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evidence-harness"
version = "0.1.0.dev0"
description = "Local-first, evidence-producing RAG testbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
rag-harness = "rag_harness.cli:main"

[project.optional-dependencies]
telemetry = [
  "opentelemetry-api==1.43.0",
  "opentelemetry-sdk==1.43.0",
  "opentelemetry-exporter-otlp-proto-http==1.43.0",
  "openinference-instrumentation==0.1.54",
  "openinference-semantic-conventions==0.1.30",
]
rag = [
    "qdrant-client==1.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "service: requires live local Qdrant and/or Ollama services",
    "framework: requires the extracted frozen Technical Prototype V0.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]
